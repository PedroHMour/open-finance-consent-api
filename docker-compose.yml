version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: openfinance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: openfinance
      POSTGRES_PASSWORD: openfinance123
      POSTGRES_DB: openfinancedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - openfinance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfinance -d openfinancedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openfinance-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgresql://openfinance:openfinance123@postgres:5432/openfinancedb?schema=public"
      JWT_SECRET: jwt_secret_openfinance_2024
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: refresh_secret_openfinance_2024
      JWT_REFRESH_EXPIRES_IN: 7d
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - openfinance-network

volumes:
  postgres_data:

networks:
  openfinance-network:
    driver: bridge
