services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openfinance
      POSTGRES_PASSWORD: openfinance
      POSTGRES_DB: openfinance
    # Exposto só na máquina local e na porta 5433, para não conflitar com um Postgres já instalado.
    # A API não usa esta porta (fala com o banco pela rede interna do compose).
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openfinance -d openfinance']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://openfinance:openfinance@db:5432/openfinance
      # Lido do arquivo .env (copie o .env.example). O segredo não fica versionado aqui.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
